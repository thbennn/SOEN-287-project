<!DOCTYPE html>
<html lang="en">
<head>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css" 
  integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw==" 
  crossorigin="anonymous" referrerpolicy="no-referrer" />
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register</title>
  <link rel="stylesheet" href="../Css/style.css">
</head>
<body>
  <div class="logo">
    <img src="../Photos/logo.png" alt="university logo">
  </div>

  <div class="container">
     <div class="form-box" id="register-form">
        <form action="">
          <h2>Register</h2>
          <input type="text" name="first-name" placeholder="First name" required>
          <input type="text" name="last-name" placeholder="Last name" required>
          <input type="date" id="dob" name="dob" required>
          <input type="tel" name="phone" placeholder="Phone number">
          <input type="text" name="student-id" placeholder="Student ID" pattern="[0-9]{8}" maxlength="8">
          <div class="input-wrapper">
          <input type="email" name="email" placeholder="Email" required>
          <i class="fa-solid fa-envelope input-icon"></i>
          </div>
          <div class="input-wrapper">
          <input type="password" name="password" placeholder="Password" required>
          <i class="fa-solid fa-lock input-icon"></i>
          </div>
          <div class="input-wrapper">
          <input type="password" name="confirm-password" placeholder="Re-enter password" required>
          <i class="fa-solid fa-lock input-icon"></i>
          </div>
          <button type="submit" name="register">Register</button>
          <p>Already have an account? <a href="login.html">Login</a></p>
 
        </form>
        
    </div> 



  </div>

  <script>
  document.querySelector('form').addEventListener('submit', async (e) => {
    e.preventDefault();
    const password = document.querySelector('[name="password"]').value;
    const confirmPassword = document.querySelector('[name="confirm-password"]').value;

  // Check passwords match
  if (password !== confirmPassword) {
    alert('Passwords do not match!');
    return;
  }

  // Check password length
  if (password.length < 6) {
    alert('Password must be at least 6 characters!');
    return;
  }

    const data = {
      firstName: document.querySelector('[name="first-name"]').value,
      lastName: document.querySelector('[name="last-name"]').value,
      email: document.querySelector('[name="email"]').value,
      password: document.querySelector('[name="password"]').value,
      phone: document.querySelector('[name="phone"]').value,
      dob: document.querySelector('[name="dob"]').value,
      studentId: document.querySelector('[name="student-id"]').value,
      role: 'student'
    };

    const res = await fetch('/api/auth/register', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(data)
    });

    const result = await res.json();

    if (res.ok) {
      alert('Registration successful!');
      window.location.href = 'login.html';
    } else {
      alert(result.message);
    }
  });
</script>

  
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css" 
  integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw==" 
  crossorigin="anonymous" referrerpolicy="no-referrer" />
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register</title>
  <link rel="stylesheet" href="../Css/style.css">
</head>
<body>
  <div class="logo">
    <img src="../Photos/logo.png" alt="university logo">
  </div>

  <div class="container">
     <div class="form-box" id="register-form">
        <form action="">
          <h2>Register</h2>
          <input type="text" name="first-name" placeholder="First name" required>
          <input type="text" name="last-name" placeholder="Last name" required>
          <input type="text" id="dob" name="dob" pattern="\d{2}/\d{2}/\d{4}" maxlength="10" placeholder="Date of Birth (mm/dd/yyyy)"  required>
          <input type="tel" name="phone" placeholder="Phone number">
          <input type="text" name="student-id" placeholder="Student ID" pattern="[0-9]{8}" maxlength="8">
          <div class="input-wrapper">
          <input type="email" name="email" placeholder="Email" required>
          <i class="fa-solid fa-envelope input-icon"></i>
          </div>
          <div class="input-wrapper">
          <input type="password" name="password" placeholder="Password" required>
          <i class="fa-solid fa-lock input-icon"></i>
          </div>
          <div class="input-wrapper">
          <input type="password" name="confirm-password" placeholder="Re-enter password" required>
          <i class="fa-solid fa-lock input-icon"></i>
          </div>
          <select name="role" required>
            <option value="">---Select Role---</option>
            <option value="student">Student</option>
            <option value="admin">Admin</option>
           </select> 
          <button type="submit" name="register">Register</button>
          <p>Already have an account? <a href="login.html">Login</a></p>
 
        </form>
        
    </div> 



  </div>

  
</body>
</html>

     <div class="container">
    <div class="form-box">

      
  

  <h2>Edit Profile</h2>

      <div class="form-row">
        <div class="form-group">
          <label>First Name</label>
          <input type="text"  placeholder="First name" value="Ben" readonly/>
        </div>
        <div class="form-group">
          <label>Last Name</label>
          <input type="text" placeholder="Last name" value="Patel" readonly/>
        </div>
      </div>
      
      <div class="form-row">
        <div class="form-group">
          <label>Email</label>
          <div class="input-wrapper">
            <input type="email" placeholder="Email" value="benpatel123@gmail.com"/>
            <i class="fa-solid fa-envelope input-icon"></i>
          </div>
        </div>
        <div class="form-group">
          <label>Phone Number</label>
          <div class="input-wrapper">
            <input type="tel" placeholder="Phone number" value="4387569820" />
            <i class="fa-solid fa-phone input-icon"></i>
          </div>
        </div>
      </div>
      
      <div class="form-row">
        <div class="form-group">
          <label>Student ID</label>
          <input type="text" placeholder="Student ID" value="40389228" readonly />
        </div>
        <div class="form-group">
          <label>Date of Birth</label>
          <input type="date" placeholder="mm/dd/yyyy" value="07-17-2000"/>
        </div>
      </div>
      
      <div class="form-group full-width">
        <label>New Password</label>
        <div class="input-wrapper">
          <input type="password" placeholder="Enter new password" id="passwordInput"/>
          <i class="fa-solid fa-lock input-icon"></i>
        </div>
      </div>

      <div class="form-group full-width">
        <label>Confirm Password</label>
        <div class="input-wrapper">
          <input type="password" placeholder="Re-enter new password" id="confirmPasswordInput"/>
          <i class="fa-solid fa-lock input-icon"></i>
        </div>
      
      </div>
      <button type="submit">Save Changes</button>
    </div>
  </div>
